env:
  variables:
    REPOSITORY_URI: 469740788063.dkr.ecr.eu-west-2.amazonaws.com/harness-ecs-lab

phases:
  pre_build:
    commands:
      - echo Logging in to ECR...
      - aws ecr get-login-password --region eu-west-2 | docker login --username AWS --password-stdin $REPOSITORY_URI

  build:
    commands:
      - echo Build started...
      - docker build -t harness-ecs-lab .
      - docker tag harness-ecs-lab:latest $REPOSITORY_URI:v1

  post_build:
    commands:
      - echo Pushing image...
      - docker push $REPOSITORY_URI:v1

artifacts:
  files: '**/*'
